# Edge proxy. TLS is expected to terminate here (certificates mounted at /etc/nginx/certs)
# or at an upstream load balancer. The API is only reachable on the internal network by the
# portals' servers (BFF); /api/v1/public/* is published for white-label login pages.

upstream api_fpm { server api:9000; }
upstream partner { server partner:3000; }
upstream admin   { server admin:3001; }

# Internal API endpoint used by the portal servers (not published on the host).
server {
    listen 8080;
    root /var/www/html/public;
    client_max_body_size 12m;

    location / { try_files $uri /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass api_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 90s;
    }
    location ~ /\.(?!well-known) { deny all; }
}

# Partner portal: platform domain and agency custom domains (white-label).
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 12m;
    location / {
        proxy_pass http://partner;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# Admin portal: restrict by IP/VPN in production.
server {
    listen 80;
    server_name admin.*;
    # allow 10.0.0.0/8; deny all;
    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
